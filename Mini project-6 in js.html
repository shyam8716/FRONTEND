  <script>

    }
    else{
      document.write("No develivery charge",develivery_charges,"<br>")
    }
    final_amount = final_amount + develivery_charges

    let paid = parseFloat(prompt("Enter the amount paid:"))
if(paid >= final_amount){

}
else{

    document.write("Remaining amount to pay : ", remaining)
}
