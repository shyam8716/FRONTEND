<html>
  <head>
    <title>Mini project-12 in js.html</title>
  </head>
  <body>
    <center>
      <div class="to-do">
        <span>To Do Lists</span>
        <div class="tasks">
          <input type="text"placeholder="add your daily tasks here---" class="task"/>
          <button type="submit" onclick="addtask()" class="adding">Add Tasks</button>
        </div>
      </div>
      <ul class="lists" type="disc"></ul>
    </center>
  </body>
  <script>
    Window.addtask()=function(){
      let taskinput=document.getElementsByClassName("task")[0]
      let taskvalue=taskinput.value.trim()
      if(taskvalue===""){
        alert("Enter the task first!")
      }
      let li=document.createElement("li")
      li.textContent=taskvalue
      let remove=document.getElementsByClassName("lists")[0].appendchild(li)
    }
    taskinput.value=""
    li.onclick=function(){
      this.remove()
    }
  </script>
</html>
