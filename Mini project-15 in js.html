<!DOCTYPE html>
<html>
  <head>
    <title>Heading generator</title>
    <meta charset="UTF-8" />
    <style>
      * {
        color:white;
        background-color:black;
      }
      button {
        color: purple;
        background-color: cyan;
        border-radius: 30px;
        padding: 10px 25px;
        cursor: pointer;
      }

      button:hover {
        color: red;
        background-color: darkgreen;
      }

      .heading {
        color: aqua;
        background-color: aliceblue;
      }
    </style>
  </head>
  <body>
    <center>
      <button type="button" id="Button" onclick="">Submit</button><br />
      <h1
        style="color: aqua; background-color: aliceblue; display: inline-block"
        class="heading"
      ></h1>
    </center>
  </body>
  <script>
    let a = document.getElementById("Button");
let b = document.getElementsByClassName("heading")[0];
a.addEventListener("click", function (e) {
  e.preventDefault();
  b.textContent = "Welcome to javascript";
});
  </script>
