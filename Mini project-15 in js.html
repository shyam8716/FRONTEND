<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse of a string</title>
  <style>   
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050510;
    font-family: 'Courier New', monospace;
    overflow: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,255,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(20deg) scale(1.5);
    animation: gridMove 8s linear infinite;
    pointer-events: none;
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,255,255,0.03) 2px,
        transparent 4px
    );
}
input {
    width: 320px;
    padding: 15px;
    background: #080d1d;
    border: 1px solid #00ffff;
    outline: none;
    color: #00ffff;
    font-family: inherit;
    font-size: 16px;
    transition: 0.4s;
    box-shadow: 0 0 5px #00ffff;
}
input::placeholder {
    color: #567b8b;
}
input:focus {
    box-shadow: 0 0 15px #00ffff,
                inset 0 0 10px rgba(0,255,255,0.2);
    transform: scale(1.04);
}
button {
    padding: 15px 25px;
    margin-left: 10px;
    background: #ff00ff;
    color: white;
    border: none;
    font-family: inherit;
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.4s;
    box-shadow: 0 0 10px #ff00ff;
}
button:hover {
    background: #00ffff;
    color: #050510;
    box-shadow: 0 0 10px #00ffff,
                0 0 30px #00ffff;
    transform: translateY(-5px) skew(-3deg);
}
button:active {
    transform: scale(0.93);
}
.result {
    display: block;
    margin-top: 30px;
    color: #00ffff;
    font-size: 18px;
    text-shadow: 0 0 10px #00ffff;
    animation: resultGlow 2s infinite alternate;
    overflow-wrap: anywhere;
}
@keyframes glitch {
    0%, 90%, 100% {
        transform: translate(0);
    }
    92% {
        transform: translate(-3px, 2px);
    }
    94% {
        transform: translate(3px, -2px);
    }
    96% {
        transform: translate(-2px, 0);
    }
}
@keyframes gridMove {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 0 40px;
    }
}
@keyframes resultGlow {
    from {
        text-shadow: 0 0 5px #00ffff;
    }
    to {
        text-shadow: 0 0 20px #00ffff,
                     0 0 30px #00ffff;
    }
}
@media (max-width: 500px) {
    input {
        width: 90%;
    }

    button {
        margin: 20px 0 0;
    }

    .result {
        font-size: 15px;
    }
}
  </style>
</head>
<body>
  <input type="text" placeholder="Enter the text" id="inputs" />
    <button type="submit" onclick="reversing_a_string()">Submit</button><br />
    <b class="result"></b>
</body>
<script>
  function reversing_a_string(){
  let input = document.getElementById("inputs").value;
  let result = document.getElementsByClassName("result")[0];
  let reverse = "";
  for (let e = input.length - 1; e >= 0; e--) {
    reverse += input[e];
  }
  if (input === "") {
    alert("Please enter the value first");
  } else {
    result.textContent = "The reversed string is : " + reverse;
  }
};
</script>
</html>
